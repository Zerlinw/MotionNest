ze": 24, "x": 60, "y": 1020, "width": 600, "align": "left", "color": "#CDD6E4", "caption": false}, "animation": {"enter": "fade", "duration_ms": 600}, "evidence_ids": []}], "camera": null}, {"id": "scene-05", "shot_id": "shot-5", "duration_ms": 5000, "layers": [{"id": "layer-05-bar", "type": "shape", "props": {"x": 140, "y": 460, "w": 10, "h": 160, "color": "#4A88C7", "radius": 5}, "animation": {"enter": "fade", "duration_ms": 400}, "evidence_ids": []}, {"id": "layer-05-text", "type": "text", "props": {"text": "服务承诺", "size": 52, "x": 190, "y": 460, "width": 1000, "align": "left", "color": "#F5F7FA", "caption": false}, "animation": {"enter": "slide-up", "duration_ms": 800}, "evidence_ids": []}, {"id": "layer-05-brand", "type": "text", "props": {"text": "XR-500 工业巡检机器人", "size": 24, "x": 60, "y": 1020, "width": 600, "align": "left", "color": "#CDD6E4", "caption": false}, "animation": {"enter": "fade", "duration_ms": 600}, "evidence_ids": []}], "camera": null}, {"id": "scene-06", "shot_id": "shot-6", "duration_ms": 4000, "layers": [{"id": "layer-06-chart", "type": "chart", "props": {"chart_type": "bar", "series": [{"name": "XR-500", "value": 12.0}, {"name": "XR-500 Pro", "value": 18.0}, {"name": "XR-500 Lite", "value": 8.0}], "title": "续航小时 8 ~ 18（specs.csv） · 覆盖距离公里 3 ~ 8（sp"}, "animation": {"enter": "draw", "duration_ms": 800}, "evidence_ids": []}, {"id": "layer-06-brand", "type": "text", "props": {"text": "XR-500 工业巡检机器人", "size": 24, "x": 60, "y": 1020, "width": 600, "align": "left", "color": "#CDD6E4", "caption": false}, "animation": {"enter": "fade", "duration_ms": 600}, "evidence_ids": []}], "camera": null}, {"id": "scene-07", "shot_id": "shot-7", "duration_ms": 3000, "layers": [{"id": "layer-07-cta", "type": "text", "props": {"text": "欢迎联系获取详细方案", "size": 64, "x": 0, "y": 420, "width": 1920, "align": "center", "color": "#4A88C7", "caption": false}, "animation": {"enter": "scale", "duration_ms": 800}, "evidence_ids": []}, {"id": "layer-07-bar", "type": "shape", const PALETTE = ["#4f8ef7", "#f7724f", "#38c6a4", "#b478f0", "#f7c948"];
function chartSVG(p) {
  const series = (p.series || []).map(s => ({ name: String(s.name), value: Number(s.value) || 0 }));
  if (!series.length) return '<svg width="100%" height="100%"></svg>';
  const W = COMP.width, H = COMP.height, pad = 120;
  const max = Math.max(...series.map(s => Math.abs(s.value)), 1);
  const bw = (W - pad * 2) / series.length;
  let bars = "";
  series.forEach((s, i) => {
    const h = (Math.abs(s.value) / max) * (H - pad * 2);
    const x = pad + i * bw + bw * 0.15, y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${bw * 0.7}" height="${h}" rx="8" fill="${PALETTE[i % PALETTE.length]}"/>`;
    bars += `<text x="${x + bw * 0.35}" y="${H - pad + 36}" fill="#cdd6e4" font-size="26" text-anchor="middle">${s.name}</text>`;
    bars += `<text x="${x + bw * 0.35}" y="${y - 14}" fill="#f5f7fa" font-size="28" text-anchor="middle">${s.value}</text>`;
  });
  return `<svg width="${W}" height="${H}">${bars}</svg>`;
}
function applyAnimation(el, anim) {
  const type = (anim && anim.enter) || "fade";
  const dur = (anim && anim.duration_ms) || 600;
  const name = { fade: "mn-fade", "slide-up": "mn-slide-up", "slide-down": "mn-slide-down",
                 scale: "mn-scale", draw: "mn-draw", "count-up": "mn-count-up" }[type] || "mn-fade";
  el.style.animation = `${name} ${dur}ms cubic-bezier(.22,.61,.36,1) both`;
}
function renderScene(stage, scene) {
  stage.innerHTML = "";
  (scene.layers || []).forEach(layer => {
    const el = document.createElement("div");
    el.className = "mn-layer";
    el.id = layer.id;
    el.dataset.mnId = layer.id;
    const p = layer.props || {};
    if (layer.type === "chart") {
      el.innerHTML = chartSVG(p);
      el.style.inset = "0";
    } else if (layer.type === "image") {
      const fit = p.fit || "cover";
      el.innerHTML = `<img src="${p.src}" alt="" style="width:100%;height:100%;object-fit:${fit};border-radius:${p.radius || 12}px;display:block">`;
      el.style.left = (p.x || 0) + "px";
      el.style.top = (p.y || 0) + "px";
      el.style.width = (p.w || 400) + "px";
      el.style.height = (p.h || 300) + "px";
    } else if (layer.type === "text") {
      el.classList.add("mn-text");
      if (p.caption !== false) el.classList.add("mn-caption");
      el.textContent = p.text || "";
      el.style.left = (p.x || 0) + "px";
      el.style.top = (p.y || 0) + "px";
      el.style.fontSize = (p.size || 36) + "px";
      if (p.color) el.style.color = p.color;
      if (p.width) el.style.width = p.width + "px";
      if (p.align === "center") { el.style.left = "0"; el.style.textAlign = "center"; }
      el.style.whiteSpace = "pre-line";
    } else {
      el.style.left = (p.x || 0) + "px";
      el.style.top = (p.y || 0) + "px";
      el.style.width = (p.w || 200) + "px";
      el.style.height = (p.h || 200) + "px";
      el.style.background = p.color || "#4f8ef7";
      el.style.borderRadius = (p.radius || 12) + "px";
    }
    applyAnimation(el, layer.animation || {});
    stage.appendChild(el);
  });
}
